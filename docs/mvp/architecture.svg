<rect width="1600" height="1000" fill="#f3f7fc"/>
<text x="50" y="60" class="title">M13 · Kiến trúc bản đã triển khai</text><text x="50" y="96" class="s">Hai môi trường độc lập · Public chỉ review demo; tiếp nhận CVAT hiện chạy local có cấp quyền</text>
<rect x="35" y="125" width="1530" height="320" rx="20" fill="#e6f1ff"/>
<text x="60" y="165" class="h">PUBLIC · Render Free · HTTPS · không extension</text>
<rect x="65" y="205" width="320" height="190" rx="14" class="box"/><text x="85" y="240" class="h">Browser người trải nghiệm</text><text x="85" y="277" class="b">Trải nghiệm demo → ảnh/nhãn</text><text x="85" y="311" class="b">Nghi vấn → ba verdict → stats</text><text x="85" y="353" class="s">Cookie HttpOnly/Secure, phiên riêng</text>
<rect x="465" y="205" width="440" height="190" rx="14" class="box"/><text x="485" y="240" class="h">Web + FastAPI · cùng origin</text><text x="485" y="277" class="b">Auth / Origin / role demo / giới hạn body</text><text x="485" y="311" class="b">QueueService · ảnh/evidence · verdict/stats</text><text x="485" y="353" class="s">Bundle SHA256 · hồ sơ PDF/PNG/MP4 công khai</text>
<rect x="1000" y="205" width="500" height="190" rx="14" class="box"/><text x="1020" y="240" class="h">PostgreSQL17 Free · persistent</text><text x="1020" y="277" class="b">demo_assets: 10BDD + snapshots + hồ sơ hash</text><text x="1020" y="311" class="b">verdicts append-only · state / auth sessions</text><text x="1020" y="353" class="s">Backup thủ công; DB hết hạn 15/11/2026</text>
<path d="M385 300H460M905 300H995" class="flow"/>
<rect x="35" y="470" width="1530" height="370" rx="20" fill="#e8f5ef"/>
<text x="60" y="510" class="h">LOCAL · CVAT2.74.1 + API loopback + extension hoặc web intake</text>
<rect x="65" y="550" width="300" height="230" rx="14" class="box"/><text x="85" y="587" class="h">CVAT · task/job/frame</text><text x="85" y="627" class="b">Ảnh gốc + nhãn đã Save</text><text x="85" y="665" class="b">Canvas chưa Save nằm riêng</text><text x="85" y="709" class="s">Operator cấu hình server, credentials</text><text x="85" y="739" class="s">và task allowlist ở backend</text>
<rect x="425" y="550" width="420" height="230" rx="14" class="box"/><text x="445" y="587" class="h">JobRegistry + adapter CVAT</text><text x="445" y="627" class="b">Đọc/kiểm hash → mapping ID thật</text><text x="445" y="665" class="b">7 signals hình học/ngữ cảnh → rule</text><text x="445" y="709" class="s">Detector cache kiểm hash ảnh/model; thiếu spec → partial</text><text x="445" y="739" class="s">Không đoán ảnh trùng, frame step, job 3D</text>
<rect x="920" y="550" width="580" height="230" rx="14" class="box"/><text x="940" y="587" class="h">/jobs/{key}/ · dữ liệu riêng từng job</text><text x="940" y="627" class="b">key = hash(server, task, job); registry + SQLite</text><text x="940" y="665" class="b">Snapshot/version/provenance → queue/evidence</text><text x="940" y="709" class="b">Save → đọc lại → recheck → snapshot mới</text><text x="940" y="745" class="s">Giữ queue cũ, verdict/history, retry request_id</text>
<path d="M365 665H420M845 665H915" class="flow"/>
<text x="60" y="892" class="h">Ngoài đường chạy public</text><text x="60" y="930" class="b">Detector RT-DETR: predictions cache độc lập · Guideline/Gemini: adapter trích luật + người duyệt · GBM/retrain: không chạy online</text><text x="60" y="968" class="s">Contracts giữ nguyên: SignalResult · yolo_preds.parquet · ranked_queue CSV. Evidence là artifact riêng. Không credentials trên frontend.</text>

services:
  - type: web
    name: m13-live-demo
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: pip install --no-cache-dir -r deployment/render/requirements.lock
    startCommand: python -m uvicorn src.api.render_app:create_render_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: M13_DATABASE_URL
        fromDatabase:
          name: m13-demo-db
          property: connectionString
      - key: M13_AUTH_SECRET
        generateValue: true
      - key: M13_DEMO_BUNDLE_ID
        sync: false
databases:
  - name: m13-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
